<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#125b78">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CQA Campo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>CQA Campo</title>
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("cqa_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<header class="topbar" id="topbar">
  <button id="logo" class="logo" type="button" aria-label="Ir al inicio">CQA CLEAN</button>
  <div class="acts">
    <button id="btn-tema" class="ib" type="button" aria-label="Cambiar tema claro u oscuro">☾</button>
    <button id="btn-menu" class="ib" type="button" aria-label="Abrir menú de temas">☰</button>
    <button id="btn-avatar" class="av" type="button" aria-label="Abrir mi cuenta"><span id="av-txt">?</span><i id="av-dot" class="dot" hidden></i></button>
  </div>
</header>
<div id="estado" class="estado ok" aria-live="polite"></div>
<main id="app"><div class="loading"><div class="spin"></div>Cargando…</div></main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer-l" class="drawer left" aria-label="Menú de navegación" hidden></aside>
<aside id="drawer-r" class="drawer right" aria-label="Cuenta" hidden></aside>
<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
